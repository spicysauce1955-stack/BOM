name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Without this the Postgres half of every dual-run test SKIPS, and the
      # suite goes green having proved nothing about the deployed dialect.
      FENCEAI_TEST_POSTGRES: postgresql://postgres:test@localhost:5432/postgres
      FENCEAI_AI: stub
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # `--extra iap` for the same reason as `--extra postgres` above: without
      # it `tests/identity/test_iap.py` is skipped whole by its
      # `pytest.importorskip("jwt")` — the entire signature /
      # audience / issuer / algorithm-pin / key-rotation suite standing behind
      # the one adapter that meets real Google — and the merge gate goes green
      # having proved nothing about it.
      - run: uv sync --extra postgres --extra iap
      - name: Full suite, both backends
        run: uv run pytest -q
      - name: Release gate
        run: uv run pytest tests/scenarios -q
  container:
    # Slice 5 owns build-and-push. This job pushes nothing: it builds the image
    # and runs it, because `tests/deploy/test_container.py` skips without a
    # daemon and slice 1's amendment already ruled on that shape — "a dual-run
    # that nothing runs proves nothing". FENCEAI_TEST_DOCKER makes those tests
    # FAIL rather than skip if Docker is unusable, so this job cannot go green
    # by doing nothing.
    runs-on: ubuntu-latest
    env:
      FENCEAI_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # No extras on the RUNNER on purpose. psycopg and PyJWT belong in the
      # IMAGE, and installing them here too would hide a deploy test that had
      # quietly come to depend on the host environment.
      - run: uv sync
      - name: Build the image and run it
        run: uv run pytest tests/deploy -q
