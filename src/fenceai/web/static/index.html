<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fence AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Fence AI</h1>
    <div class="project-bar">
      <select id="project-select"></select>
      <input id="new-project-name" placeholder="new project name">
      <button id="btn-new-project">Create</button>
      <span id="ai-badge" class="badge"></span>
    </div>
  </header>

  <nav id="tabs">
    <button data-tab="canvas" class="active">Topology &amp; Strategy</button>
    <button data-tab="annotations">Annotations</button>
    <button data-tab="knowledge">Knowledge</button>
    <button data-tab="review">Review queue</button>
    <button data-tab="bom">BOM</button>
    <button data-tab="inventory">Inventory</button>
  </nav>

  <main>
    <!-- ============ canvas tab ============ -->
    <section id="tab-canvas" class="tab active">
      <div class="canvas-row">
        <div class="canvas-col">
          <div class="toolbar">
            <button id="btn-draw" class="mode active" title="Click to place fence nodes; double-click or Esc to finish">✏️ Draw runs</button>
            <button id="btn-clear-topo">🗑 Clear topology</button>
            <button id="btn-generate" class="primary">⚙ Generate strategy</button>
            <label><input type="checkbox" id="chk-overlay" checked> show strategy overlay</label>
          </div>
          <svg id="canvas" viewBox="0 0 900 500" preserveAspectRatio="xMidYMid meet">
            <g id="g-grid"></g>
            <g id="g-topology"></g>
            <g id="g-overlay"></g>
            <g id="g-draft"></g>
          </svg>
          <div id="warnings"></div>
        </div>
        <aside class="side-col">
          <div class="panel">
            <h3>Run editing</h3>
            <select id="run-select"></select>
            <details open><summary>Gate</summary>
              <input id="gate-station" type="number" placeholder="station mm">
              <input id="gate-width" type="number" value="1000" placeholder="width mm">
              <input id="gate-kit" value="GATE-KIT-1000" placeholder="kit sku">
              <button id="btn-add-gate">Add gate</button>
            </details>
            <details><summary>Base interval</summary>
              <input id="base-start" type="number" placeholder="start mm">
              <input id="base-end" type="number" placeholder="end mm">
              <select id="base-surface">
                <option value="soil">soil</option>
                <option value="concrete">concrete</option>
                <option value="masonry_wall">masonry wall</option>
              </select>
              <button id="btn-add-base">Set base</button>
            </details>
            <details><summary>Elevation sample</summary>
              <input id="elev-station" type="number" placeholder="station mm">
              <input id="elev-z" type="number" placeholder="z mm">
              <button id="btn-add-elev">Add sample</button>
            </details>
            <details><summary>Height intent</summary>
              <input id="height-start" type="number" placeholder="start mm">
              <input id="height-end" type="number" placeholder="end mm">
              <input id="height-mm" type="number" value="1800" placeholder="height mm">
              <button id="btn-add-height">Set height intent</button>
            </details>
            <details><summary>Override: pin post</summary>
              <input id="pin-station" type="number" placeholder="station mm">
              <button id="btn-pin-post">Pin post</button>
            </details>
            <div id="override-list"></div>
          </div>
          <div class="panel" id="inspector">
            <h3>Inspector</h3>
            <div id="inspector-body"><em>Click a generated post, span, or gate.</em></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ============ annotations tab ============ -->
    <section id="tab-annotations" class="tab">
      <div class="panel">
        <h3>Attach annotation</h3>
        <select id="ann-target"></select>
        <input id="ann-text" placeholder="e.g. keep the top aligned with the neighbour (approx. 1750)" size="60">
        <button id="btn-add-ann">Add</button>
      </div>
      <div id="annotation-list"></div>
    </section>

    <!-- ============ knowledge tab ============ -->
    <section id="tab-knowledge" class="tab">
      <div class="panel">
        <h3>New knowledge version (JSON actions)</h3>
        <input id="k-object" placeholder="object id e.g. K-MAXSPAN">
        <select id="k-type">
          <option>hard_constraint</option><option>company_rule</option>
          <option>preference</option><option>heuristic</option><option>fact</option>
        </select>
        <input id="k-title" placeholder="title" size="40">
        <textarea id="k-actions" rows="3" cols="70">[{"kind": "set_param", "param": "max_span_mm", "value": 1800}]</textarea>
        <button id="btn-add-knowledge">Save new version</button>
      </div>
      <div id="knowledge-list"></div>
    </section>

    <!-- ============ review tab ============ -->
    <section id="tab-review" class="tab">
      <div class="panel">
        <button id="btn-propose">Propose knowledge from corrections</button>
      </div>
      <div id="candidate-list"></div>
    </section>

    <!-- ============ bom tab ============ -->
    <section id="tab-bom" class="tab">
      <div id="bom-body"><em>Generate a strategy first.</em></div>
    </section>

    <!-- ============ inventory tab ============ -->
    <section id="tab-inventory" class="tab">
      <div class="panel">
        <h3>Inventory (JSON)</h3>
        <textarea id="inventory-json" rows="10" cols="80"></textarea>
        <button id="btn-save-inventory">Save inventory</button>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
